<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用文档中心</title>
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --gold-primary: #d4af37;
            --gold-dark: #b8960c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #d4af37 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header .subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .app-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .app-card.sudoku .card-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .app-card.gold .card-header {
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
        }

        .app-card.goldpro .card-header {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .card-header {
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .app-icon {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 22px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-header .tagline {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .card-body {
            padding: 28px 30px;
        }

        .card-body .description {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .card-links {
            display: flex;
            gap: 12px;
        }

        .card-link {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .app-card.sudoku .card-link {
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            color: var(--primary-color);
        }

        .app-card.sudoku .card-link:hover {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .app-card.gold .card-link {
            background: linear-gradient(135deg, #fefce8 0%, #fef3c7 100%);
            color: #92400e;
        }

        .app-card.gold .card-link:hover {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .app-card.goldpro .card-link {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            color: #92400e;
        }

        .app-card.goldpro .card-link:hover {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .card-link svg {
            width: 18px;
            height: 18px;
        }

        .footer {
            text-align: center;
            color: white;
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 40px;
            padding: 0 20px;
        }

        @media (max-width: 900px) {
            .app-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (max-width: 700px) {
            body {
                background-attachment: scroll;
                padding: 16px;
                align-items: flex-start;
            }

            .app-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .header {
                margin-bottom: 24px;
            }

            .header h1 {
                font-size: 1.6rem;
            }

            .logo {
                width: 60px;
                height: 60px;
                border-radius: 14px;
                font-size: 28px;
            }

            .card-header {
                padding: 32px 24px;
            }

            .card-header h2 {
                font-size: 1.3rem;
            }

            .card-body {
                padding: 20px;
            }

            .card-body .description {
                font-size: 0.9rem;
            }

            .app-icon {
                width: 76px;
                height: 76px;
                border-radius: 18px;
            }

            .card-links {
                flex-direction: column;
            }

            .card-link {
                padding: 12px 16px;
                font-size: 0.9rem;
            }

            .footer {
                margin-top: 24px;
                padding: 0 12px;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .card-header {
                padding: 24px 18px;
            }

            .card-body {
                padding: 16px;
            }
        }

        @supports (padding: env(safe-area-inset-bottom)) {
            body {
                padding-bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

        <div class="header">

            <h1>应用文档中心</h1>

                    <div class="card-links">

                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>
                                <polyline points="10 9 9 9 8 9"/>
                            </svg>
                            用户协议
                        </a>
                    </div>
                </div>
            </div>

            <div class="app-card gold">
                <div class="card-header">
                    <div class="app-icon">
                        <img src="https://anhaoxi.github.io/images/goldsavingassistant.png" alt="攒金小助手">

                    <h2>攒金小助手</h2>

                <div class="card-body">

                    <div class="card-links">
                        <a href="apps/goldsavingassistant/privacy-policy.html" class="card-link">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            隐私政策
                        </a>
                        <a href="apps/goldsavingassistant/terms-of-use.html" class="card-link">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>
                                <polyline points="10 9 9 9 8 9"/>
                            </svg>
                            用户协议
                        </a>
                    </div>
                </div>
            </div>

            <div class="app-card goldpro">
                <div class="card-header">
                    <div class="app-icon">
                        <img src="https://anhaoxi.github.io/images/goldpro.png" alt="攒金Pro">
                    </div>
                    <h2>攒金Pro</h2>
                    <div class="tagline">专业黄金资产管理工具</div>
                </div>
                <div class="card-body">
                    <p class="description">专业版黄金资产管理工具，提供更全面的黄金投资记录与分析功能，助您轻松管理黄金资产。</p>
                    <div class="card-links">
                        <a href="apps/goldpro/privacy-policy.html" class="card-link">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            隐私政策
                        </a>
                        <a href="apps/goldpro/terms-of-use.html" class="card-link">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>
                                <polyline points="10 9 9 9 8 9"/>
                            </svg>
                            用户协议
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>© 2026. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
